name: Reconnect checks
on:
  pull_request:
    branches: [main, fix/standby-reconnect, test/robustness-checks]
  workflow_dispatch:
jobs:
  startup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: chmod +x gradlew
      - name: Unit tests and debug APK
        run: ./gradlew testDebugUnitTest assembleDebug assembleRelease --stacktrace
      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm
      - name: Cold start and background return smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            mkdir -p smoke
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.velastudio.teltv/.MainActivity
            sleep 12
            adb shell pidof com.velastudio.teltv
            adb shell input keyevent KEYCODE_HOME
            sleep 2
            adb shell am start -W -n com.velastudio.teltv/.MainActivity
            sleep 8
            adb shell pidof com.velastudio.teltv
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml smoke/window.xml
            adb shell screencap -p /sdcard/startup.png
            adb pull /sdcard/startup.png smoke/startup.png
            adb logcat -d > smoke/logcat.txt
            if grep -E 'FATAL EXCEPTION|Fatal signal|ANR in com.velastudio.teltv' smoke/logcat.txt; then exit 1; fi
      - name: Upload startup evidence and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconnect-startup-evidence
          path: |
            smoke/
            app/build/reports/tests/testDebugUnitTest/
            app/build/outputs/apk/debug/*.apk
