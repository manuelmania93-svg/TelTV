name: Build TelTV

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            python3 -c "
import base64, os, re
raw = os.environ.get('KEYSTORE_BASE64', '')
clean = re.sub(r'[^A-Za-z0-9+/=]', '', raw)
clean += '=' * ((4 - len(clean) % 4) % 4)
with open('teltv-release.jks', 'wb') as f:
    f.write(base64.b64decode(clean))
"
            echo "Keystore decoded successfully."
          else
            echo "Warning: KEYSTORE_BASE64 secret is not set!"
          fi

      - name: Build Debug and Release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TelTV-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: TelTV-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
