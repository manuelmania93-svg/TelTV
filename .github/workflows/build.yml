name: Build TelTV

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing!"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d '\r\n[:space:]' | base64 -d -i > teltv-release.jks
          echo "Keystore decoded successfully."

      - name: Build APKs with Gradle
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Sign Release APK with apksigner
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner at: $APKSIGNER"
          
          # Find the generated release APK
          INPUT_APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "Signing APK: $INPUT_APK"
          
          # Sign using the keystore
          $APKSIGNER sign \
            --ks teltv-release.jks \
            --ks-pass "pass:${KEYSTORE_PASSWORD:-YourSecurePassword123}" \
            --ks-key-alias "${KEY_ALIAS:-teltv}" \
            --key-pass "pass:${KEY_PASSWORD:-YourSecurePassword123}" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --out app/build/outputs/apk/release/TelTV-release.apk \
            "$INPUT_APK"

          echo "Verifying APK signature..."
          $APKSIGNER verify -v app/build/outputs/apk/release/TelTV-release.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TelTV-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: TelTV-release
          path: app/build/outputs/apk/release/TelTV-release.apk
          if-no-files-found: error
