name: Build TelTV

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      # Serializes main-branch publishes; PR runs get their own group per ref.
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Compute and validate version stamping
        run: |
          # Unique, increasing build identity per workflow run, including re-runs
          # (run_attempt increments on each re-run). Enforced bounds, not assumptions.
          VERSION_CODE=$(( ${{ github.run_number }} * 1000 + ${{ github.run_attempt }} ))
          test "${{ github.run_attempt }}" -lt 1000 || { echo "run_attempt ${{ github.run_attempt }} exceeds the 1000-attempt bound"; exit 1; }
          test "$VERSION_CODE" -le 2100000000 || { echo "VERSION_CODE $VERSION_CODE exceeds the Android versionCode cap"; exit 1; }
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=0.3.59.$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Stamped version: 0.3.59.$VERSION_CODE (versionCode $VERSION_CODE)"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs with Gradle
        run: ./gradlew assembleDebug assembleRelease --stacktrace -PciVersionCode=$VERSION_CODE -PciVersionName=$VERSION_NAME

      - name: Sign Release APK with apksigner
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner at: $APKSIGNER"
          INPUT_APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "Signing APK: $INPUT_APK"
          $APKSIGNER sign \
            --ks app/release.keystore \
            --ks-pass pass:teltv123456 \
            --ks-key-alias teltv \
            --key-pass pass:teltv123456 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --out app/build/outputs/apk/release/TelTV-release.apk \
            "$INPUT_APK"
          echo "Verifying APK signature..."
          $APKSIGNER verify -v app/build/outputs/apk/release/TelTV-release.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TelTV-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: TelTV-release
          path: app/build/outputs/apk/release/TelTV-release.apk
          if-no-files-found: error

      - name: Prepare Release APKs
        run: |
          cp app/build/outputs/apk/release/TelTV-release.apk app/build/outputs/apk/release/app-release.apk

      - name: Extract Version
        id: get_version
        run: |
          echo "version=v$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Guard rolling release against stale overwrite
        id: publish_guard
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT=$(curl -sf -H "Authorization: Bearer $GITHUB_TOKEN"             "https://api.github.com/repos/${{ github.repository }}/releases/tags/rolling-release" | jq -r '.name // ""') || CURRENT=""
          echo "currently published release name: $CURRENT"
          # Stamped releases end in the numeric version code; legacy unstamped names fall back to 0.
          REMOTE_CODE=$(echo "$CURRENT" | grep -oE '[0-9]+$' || true)
          REMOTE_CODE=${REMOTE_CODE:-0}
          echo "remote_code=$REMOTE_CODE" >> $GITHUB_OUTPUT
          if [ "$VERSION_CODE" -le "$REMOTE_CODE" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Skip publish: stamped $VERSION_CODE is not newer than published $REMOTE_CODE"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Rolling Release
        if: github.ref == 'refs/heads/main' && steps.publish_guard.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rolling-release
          name: "TelTV ${{ steps.get_version.outputs.version }}"
          body: "Automated continuous release from commit ${{ github.sha }} (${{ steps.get_version.outputs.version }})"
          files: |
            app/build/outputs/apk/release/TelTV-release.apk
            app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
