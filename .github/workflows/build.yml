name: Build TelTV APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/teltv-release.jks"
          chmod 600 "$RUNNER_TEMP/teltv-release.jks"

      - name: Build signed APK with Gradle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/teltv-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TelTV-release
          path: app/build/outputs/apk/release/*.apk

      - name: Publish Rolling Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: rolling-release
          name: TelTV Continuous Release
          body: |
            Automated continuous release from commit ${{ github.sha }}
            - Soundbar Audio Passthrough (AC3 / DTS Bitstream)
            - In-App Auto Updater
          files: app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
