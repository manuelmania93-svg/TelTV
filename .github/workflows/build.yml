name: Build TelTV

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs with Gradle
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Sign Release APK with apksigner
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner at: $APKSIGNER"
          INPUT_APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "Signing APK: $INPUT_APK"
          $APKSIGNER sign \
            --ks app/release.keystore \
            --ks-pass pass:teltv123456 \
            --ks-key-alias teltv \
            --key-pass pass:teltv123456 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --out app/build/outputs/apk/release/TelTV-release.apk \
            "$INPUT_APK"
          echo "Verifying APK signature..."
          $APKSIGNER verify -v app/build/outputs/apk/release/TelTV-release.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TelTV-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: TelTV-release
          path: app/build/outputs/apk/release/TelTV-release.apk
          if-no-files-found: error
